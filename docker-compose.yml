version: '3.9'
services:
  rss-bridge:
    image: rssbridge/rss-bridge:latest
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cybernews
      POSTGRES_USER: cyber
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superheslo123}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:0.5.5
    ports: ["8000:8000"]
    volumes: ["chroma:/chroma/chroma"]
    restart: unless-stopped

  streamlit:
    build: ./streamlit
    ports: ["8501:8501"]
    depends_on: [postgres, chroma, ollama]
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - EXECUTIONS_MODE=queue
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=cybernews
      - DB_POSTGRESDB_USER=cyber
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-superheslo123}
    volumes: ["n8n:/home/node/.n8n"]
    restart: unless-stopped
    depends_on: [postgres]

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile"]
    restart: unless-stopped

volumes:
  ollama:
  pgdata:
  chroma:
  n8n:
